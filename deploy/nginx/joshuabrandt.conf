# joshuabrandt.conf — nginx vhost for the portfolio (Story 1.10, AC1; AR-8).
#
# INSTALL: copy this file to  /etc/nginx/conf.d/joshuabrandt.conf  then
#   sudo nginx -t && sudo systemctl reload nginx
# (scripts/deploy.sh performs the test+reload on every deploy once installed.)
#
# INGRESS REALITY (why server_name is *.vm.internal, not the public host):
# This VM sits behind Abacus Envoy ingress. The public hostname
# `joshuabrandt.abacusai.cloud` is routed to the VM and arrives here as
# `Host: joshuabrandt.vm.internal:80`, with the ORIGINAL public host preserved in
# the `X-Original-Host` request header. So nginx matches the vhost on
# `joshuabrandt.vm.internal`, and anything that must reflect the public origin
# (the api) reads it from `X-Original-Host`. (architecture.md §AR-8 names the
# public host as the conceptual server_name; the live vhost uses the .vm.internal
# name the ingress actually forwards — this comment reconciles the two.)
#
# Public URL once go-live is enabled:  https://joshuabrandt.abacusai.cloud
# NOTE: public exposure is gated on `public_url_enabled` (currently OFF — a
# user-only Cloud Services UI toggle, AR-16). Until then this vhost is verifiable
# locally:  curl -s -H 'Host: joshuabrandt.vm.internal' http://localhost/

server {
    listen 80;
    server_name joshuabrandt.vm.internal;

    # The built static Mirror (Story 1.5–1.8). `pnpm build` emits web/dist.
    root /home/ubuntu/git/portfolio/web/dist;
    index index.html;

    # Never serve dotfiles (e.g. a stray .env should NEVER be web-reachable; NFR-5).
    location ~ /\. {
        deny all;
    }

    # The API — reverse-proxy /api/* to the Hono service (systemd: portfolio-api)
    # on the localhost high port. Mirrors the Story 1.1 dev proxy so dev and prod
    # hit the same same-origin /api/* paths (AR-8). Declared BEFORE `location /`
    # so api requests never fall through to the static try_files/SPA fallback.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        # Forward the real public host (Envoy put it in X-Original-Host) so the
        # api sees the origin the visitor used, not the internal .vm.internal name.
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade headers — keep websockets / streaming responses working (the
        # Guide streams its answer over the same /api/* path in Epic 4). This is
        # nginx's documented WebSocket-proxy pattern (nginx.org/en/docs/http/
        # websocket.html): pass the client Upgrade header through and hardcode
        # `Connection "upgrade"`. The cleaner `map $http_upgrade $connection_upgrade`
        # form must live in http{} context, which a drop-in conf.d/ server block
        # cannot declare — so the documented constant is the correct choice here.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The static Mirror. Serve the requested file/dir; fall back to the home
    # document for unknown paths (so the static site degrades gracefully), and
    # 404 only when even index.html is missing. The Mirror is fully crawlable and
    # JS-off operable (NFR-1).
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
